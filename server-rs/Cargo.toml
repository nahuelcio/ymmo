[package]
name = "claudi-server"
version = "0.1.0"
edition = "2021"
description = "Claudi MMO game server (Rust port of server/src, same protocol and database)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
